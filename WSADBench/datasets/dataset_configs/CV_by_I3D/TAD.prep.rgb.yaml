PREPROCESS:
    MODALITY: RGB
    INPUT_DIR: 'WSADBench/datasets/source_datasets/TAD/'
    OUTPUT_DIR: 'WSADBench/datasets/CV_by_MViT_32/TAD/'
    RAW_DATA_DIR: 'WSADBench/datasets/source_datasets/TAD/raw_data/'
    MODALITY_SAVE_DIR: 'all_rgbs'
    RESIZE: [340, 256]
    NUM_CLIPS: -1  # 提取所有可能的clips
    NUM_FRAMES: 16
    NUM_CLASSES: 2  # 正常和异常
    CROPS: Ten
    CROP_SIZE: 224
    MODEL: WSADBench.datasets.dataset_support.pretrained_models.MViT32FeatureExtractor
    MODEL_BATCH_SIZE: 32
    COPY:
        - ['splits', 'splits']
        - ['Annotation.txt', 'Annotation.txt']  # 复制帧级别标注
    SEGMENTATION:
        SEGMENTATION_DIR: 'segmentation'
        EXCLUDE_SEGMENT_LIST: []