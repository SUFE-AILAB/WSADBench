PREPROCESS:
    MODALITY: RGB  # 转移到主文件夹而不是zsy文件夹
    INPUT_DIR: '/data/coding/wsad/WSADBench/WSADBench/datasets/source_datasets/UCF_Crime'  # 'WSADBench/datasets/source_datasets/UCF_Crime/'  # 输入总的文件夹的位置
    OUTPUT_DIR: '/data/coding/wsad/WSADBench/WSADBench/datasets/CV_by_SlowFast/UCF_Crime'  # 'WSADBench/datasets/CV_by_I3D/UCF_Crime/'  # 输出特征位置
    RAW_DATA_DIR: '/data/coding/wsad/WSADBench/WSADBench/datasets/source_datasets/UCF_Crime/raw_data' #'WSADBench/datasets/source_datasets/UCF_Crime/raw_data/'  # 原始视频位置
    MODALITY_SAVE_DIR: 'all_rgbs'  # 输出文件夹的子文件夹
    RESIZE: [340, 256]
    NUM_CLIPS: -1
    NUM_FRAMES: 16
    NUM_CLASSES: 2
    CROPS: Ten
    CROP_SIZE: 224
    MODEL: WSADBench.datasets.dataset_support.pretrained_models.SlowFastFeatureExtractor  # MViT32FeatureExtractor, I3DFeatureExtractorRGB SlowFastFeatureExtractor
    MODEL_BATCH_SIZE: 32
    COPY:
        - ['splits', 'splits']
        - ['UCF_Annotation.txt', 'UCF_Annotation.txt']
    SEGMENTATION:
        SEGMENTATION_DIR: 'segmentation'  # 更小的seg
        EXCLUDE_SEGMENT_LIST: 
            - Testing_Normal_Videos_Anomaly