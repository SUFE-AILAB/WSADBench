# RoSAS模型配置文件
# 指定模型类和参数

# 模型类路径
model_class: WSADBench.baseline.ARNet.run.ARNet

# 模型参数
parameters:
  # 训练参数
  dropout: 0.7
  model_name: "model_single"
  epochs: 1
  batch_size: 60
  lr: 0.0001
  weight_decay:  0.0010000000474974513
  # 损失权重
  DMIL_weight: 1.000
  Center_weight: 20.000
  use_scheduler: true
  scheduler_milestones: [25, 50]
